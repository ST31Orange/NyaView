[project]
name = "nyavview"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.0",
  "pydantic>=2.7.0",
  "yt-dlp>=2024.8.6",
  "imageio-ffmpeg>=0.6.0",
  "pywebview>=6.2.1",
  "pillow>=10.0.0",
]

[dependency-groups]
dev = [
  "pyinstaller>=6.22.3",
  "pytest>=8.1.0",
  "pytest-asyncio>=0.23.6",
]

[project.scripts]
nyavview = "nyavview.cli.main:run_app"
nyavview-gui = "nyavview.ui.app:main"

[build-system]
requires = ["uv_build>=0.5.0,<1.0.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
